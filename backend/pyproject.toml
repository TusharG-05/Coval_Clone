[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tushar", email = "tushar@chicmicstudios.in" }
]
requires-python = ">=3.11"
dependencies = [
    "croniter>=6.2.4",
    "deepgram-sdk>=7.10.0",
    "edge-tts>=7.2.8",
    "elevenlabs>=2.69.0",
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-client>=0.26.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
    "sqlmodel>=0.0.47",
    "twilio>=9.11.1",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
